# Clúster Kafka de AndesStay (EP5/EP6): 3 Zookeeper + 3 brokers.
#
#   cp .env.example .env      (editar KAFKA_ADVERTISED_HOST)
#   docker compose -f docker-compose.kafka.yml up -d
#   ./crear-topicos.sh        (crea los 2 topicos con 3 particiones y 3 replicas)
#
# Listeners de cada broker:
#   INTERNAL (kafkaN:29092)         -> trafico entre brokers y desde Kafka UI (red docker)
#   EXTERNAL (HOST:9092/9093/9094)  -> microservicios y ms-kafka-admin (host/VPC)
name: andesstay-kafka

x-zookeeper-base: &zookeeper-base
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  networks: [kafka-net]
  environment: &zookeeper-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 10
    ZOOKEEPER_SYNC_LIMIT: 5
    # Los 3 nodos del ensemble (peer:election). Con 3 nodos el quorum tolera la caida de 1.
    ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"

x-kafka-base: &kafka-base
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  networks: [kafka-net]
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 20s
    timeout: 15s
    retries: 10
    start_period: 40s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Los topicos se crean a proposito (ms-kafka-admin / crear-topicos.sh), no al publicar por error de tipeo
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  # Alta disponibilidad: todo con 3 copias y minimo 2 en sincronia
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  # Retencion por defecto (7 dias); cada topico puede sobreescribirla
  KAFKA_LOG_RETENTION_HOURS: 168
  # Memoria acotada para que 3 brokers quepan en una EC2 chica
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"

services:
  zookeeper1:
    <<: *zookeeper-base
    container_name: zookeeper1
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper-base
    container_name: zookeeper2
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper-base
    container_name: zookeeper3
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log

  kafka1:
    <<: *kafka-base
    container_name: kafka1
    hostname: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:?define KAFKA_ADVERTISED_HOST en .env}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-base
    container_name: kafka2
    hostname: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:?define KAFKA_ADVERTISED_HOST en .env}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-base
    container_name: kafka3
    hostname: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:?define KAFKA_ADVERTISED_HOST en .env}:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data

networks:
  # Nombre fijo para que docker-compose.kafka-ui.yml se una a la misma red
  kafka-net:
    name: andesstay-kafka-net

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
