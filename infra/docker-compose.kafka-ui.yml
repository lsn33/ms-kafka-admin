# Kafka UI: panel para administrar brokers, topicos, particiones, mensajes y consumer groups.
# Requiere que el clúster ya esté arriba (docker-compose.kafka.yml): se une a su misma red.
#
#   docker compose -f docker-compose.kafka-ui.yml up -d
#   http://<IP-EC2>:8089   (usuario/clave de KAFKA_UI_USER / KAFKA_UI_PASSWORD)
name: andesstay-kafka-ui

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8089:8080"
    networks: [kafka-net]
    environment:
      KAFKA_CLUSTERS_0_NAME: andesstay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:?define KAFKA_UI_USER en .env}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?define KAFKA_UI_PASSWORD en .env}
      JAVA_OPTS: "-Xms128m -Xmx256m"

networks:
  kafka-net:
    external: true
    name: andesstay-kafka-net
